environment: Production

replicaCount: 3

image:
  tag: "5.0.0"
  pullPolicy: IfNotPresent

namespace:
  create: true
  name: githubactionsdemo-prod

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: githubactionsdemo.example.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    - secretName: githubactionsdemo-prod-tls
      hosts:
        - githubactionsdemo.example.com

config:
  ASPNETCORE_URLS: "http://+:8080"
  Logging__LogLevel__Default: "Warning"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  AllowedHosts: "*"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2
