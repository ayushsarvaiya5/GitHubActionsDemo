name: Docker Image Publish

on:
  push:
    branches:
      - main
      - feature/*

jobs:

  # 1. CHECK BRANCH + CHECK CHANGED FILES
  check-changes:

    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    outputs:
      src_changed: ${{ steps.path-filter.outputs.src }}
      tests_changed: ${{ steps.path-filter.outputs.tests }}

    steps:

      - name: Show branch information
        run: |
          echo "=========================================="
          echo " Branch Information"
          echo "=========================================="
          echo "Branch      : ${{ github.ref_name }}"
          echo "Full ref    : ${{ github.ref }}"
          echo "Commit      : ${{ github.sha }}"
          echo "Repository  : ${{ github.repository }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for push events so paths-filter can compare git history

      - name: Check changed files
        id: path-filter
        uses: ./.github/actions/path-filter

  # 2. TEST + BUILD
  test-and-build:

    needs: check-changes

    if: |
      needs.check-changes.outputs.src_changed == 'true' ||
      needs.check-changes.outputs.tests_changed == 'true'

    uses: ./.github/workflows/dotnet-test-build.yml

  # 3. BUILD + PUSH DOCKER IMAGE
  push-docker-image:

    needs:
      - check-changes 
      - test-and-build
    
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-changes.outputs.src_changed == 'true'

    # Run on a self-hosted runner
    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    # If you want to run on a GitHub-hosted runner, uncomment the following line and comment out the above line.
    # runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
 
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v6.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactionsdemo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactionsdemo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max