name: Docker Image Publish

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  test-and-build:

    # Run on a self-hosted runner
    runs-on: [self-hosted, Linux, X64, GitHubActionsDemo-runner]

    # If you want to run on a GitHub-hosted runner, uncomment the following line and comment out the above line.
    # runs-on: ubuntu-24.04

    steps:
      - name: Show branch information
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Full ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Setup .NET : If you are not using a self-hosted runner with .NET pre-installed, uncomment the following lines to set up .NET SDK.

      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '10.0.x'
      
      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 #v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Show NuGet cache status
        run: |
          echo "=========================================="
          echo " NuGet Cache"
          echo "=========================================="
          echo "Key: ${{ steps.nuget-cache.outputs.cache-primary-key }}"
          echo "Exact cache hit: ${{ steps.nuget-cache.outputs.cache-hit }}"

          if [ "${{ steps.nuget-cache.outputs.cache-hit }}" = "true" ]; then
            echo "RESULT: ✅ EXACT CACHE HIT"
          else
            echo "RESULT: ❌ EXACT CACHE MISS"
          fi

      - name: Restore dependencies
        run: |
          dotnet restore src/GitHubActionsDemo.csproj
          dotnet restore tests/GitHubActionsDemo.Tests.csproj

      - name: Run tests
        run: dotnet test tests/GitHubActionsDemo.Tests.csproj --no-restore --configuration Release

      - name: Build
        run: dotnet build src/GitHubActionsDemo.csproj --no-restore --configuration Release

  push-docker-image:
    needs: test-and-build
    if: github.ref == 'refs/heads/main'

    # Run on a self-hosted runner
    runs-on: [self-hosted, Linux, X64, GitHubActionsDemo-runner]

    # If you want to run on a GitHub-hosted runner, uncomment the following line and comment out the above line.
    # runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactionsdemo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactionsdemo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max