name: Docker Image Publish

on:
  push:
    branches:
      - main
      - feature/*

# Required by release-please (releases, tags, release PRs) and for pushing
# the Kubernetes manifest update commit.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:

  # ============================================================
  # 1. CHECK BRANCH + CHECK CHANGED FILES
  # ============================================================
  check-changes:

    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    outputs:
      src_changed: ${{ steps.path-filter.outputs.src }}
      tests_changed: ${{ steps.path-filter.outputs.tests }}

    steps:

      - name: Show branch information
        run: |
          echo "=========================================="
          echo " Branch Information"
          echo "=========================================="
          echo "Branch      : ${{ github.ref_name }}"
          echo "Full ref    : ${{ github.ref }}"
          echo "Commit      : ${{ github.sha }}"
          echo "Repository  : ${{ github.repository }}"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check changed files
        id: path-filter
        uses: ./.github/actions/path-filter


  # ============================================================
  # 2. TEST + BUILD
  # ============================================================
  test-and-build:

    needs: check-changes

    if: |
      needs.check-changes.outputs.src_changed == 'true' ||
      needs.check-changes.outputs.tests_changed == 'true'
    uses: ./.github/workflows/dotnet-test-build.yml


  # ============================================================
  # 3. RELEASE PLEASE (VERSIONING + GIT TAG + GITHUB RELEASE)
  #
  # Only runs on main.
  #
  # Uses release-please to determine the next version from Conventional
  # Commits, maintain the CHANGELOG.md, and directly create the Git tag /
  # GitHub release on every qualifying push to main (no Release PR step,
  # because skip-github-pull-request is enabled below).
  #
  # Commit message conventions used for automatic versioning.
  # Only the commit message that lands on `main` (the squash commit, or
  # the first line of a merge commit) is read by release-please. Commits
  # on story/feature branches, or story -> feature branch merges, can say
  # anything and will not affect versioning.
  #
  # Branching flow used in this repository:
  #   main -> feature branch -> story branch -> story merged into feature (PR)
  #        -> feature merged into main (PR)
  #
  # A proper Conventional Commit message (fix:/feat:/feat!:) is ONLY
  # required on the final "feature branch -> main" PR merge. Story ->
  # feature branch merges do not need to follow this format.
  #
  # fix: ...   -> PATCH
  # feat: ...  -> MINOR
  # feat!: ... -> MAJOR
  #
  # Other commit types such as docs:, test:, refactor:, chore:, ci:, build:, and style:
  # do not trigger a Docker image version release in this setup.
  #
  # https://github.com/googleapis/release-please-action
  # ============================================================
  release-please:

    needs:
      - check-changes
      - test-and-build

    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-changes.outputs.src_changed == 'true'
    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
          skip-github-pull-request: true

      - name: Show release outcome
        run: |
          echo "=========================================="
          echo " Release Please"
          echo "=========================================="
          echo "Release created : ${{ steps.release.outputs.release_created }}"
          echo "Tag              : ${{ steps.release.outputs.tag_name }}"
          echo "Version          : ${{ steps.release.outputs.version }}"
  # ============================================================
  # 4. BUILD + PUSH DOCKER IMAGE
  # ============================================================
  push-docker-image:

    needs:
      - check-changes
      - test-and-build
      - release-please

    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-changes.outputs.src_changed == 'true' &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v6.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show Docker image version
        run: |
          echo "=========================================="
          echo " Docker Image"
          echo "=========================================="
          echo "Version : ${{ needs.release-please.outputs.version }}"
          echo "Tag     : ${{ needs.release-please.outputs.tag_name }}"
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactionsdemo:${{ needs.release-please.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactionsdemo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 5. UPDATE KUBERNETES IMAGE VERSION
  # ============================================================
  update-kubernetes-version:

    needs:
      - release-please
      - push-docker-image

    if: success()

    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update Kubernetes image tag
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          sed -i -E "s/^  newTag: .*/  newTag: ${VERSION}/" k8s/kustomization.yaml
          echo "Updated Kubernetes image tag to ${VERSION}"
          git diff -- k8s/kustomization.yaml
      - name: Commit and push Kubernetes version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "Kubernetes image tag is already ${VERSION}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore: update Kubernetes image to ${VERSION} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
















