name: Docker Image Publish

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  build-and-test:
    runs-on: [sansar-runner-1]

    steps:
      - name: Show branch information
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Full ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '10.0.x'
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          dotnet restore src/GitHubActionsDemo.csproj
          dotnet restore tests/GitHubActionsDemo.Tests.csproj

      - name: Run tests
        run: dotnet test tests/GitHubActionsDemo.Tests.csproj --no-restore --configuration Release

      - name: Build
        run: dotnet build src/GitHubActionsDemo.csproj --no-restore --configuration Release

  push-docker-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    runs-on: [sansar-runner-1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactionsdemo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/githubactionsdemo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max