# ----------------- Summary --------------------
#
# This workflow performs CodeQL security analysis on the repository.
#
# It is triggered by:
# - Pushes to the `main` branch
# - Pull requests targeting the `main` branch
# - Manual execution using the `workflow_dispatch` event
#
# The workflow runs on a self-hosted runner with the `GitHubActionsDemo-runner` label.
#
# The workflow performs the following steps:
# 1. Checks out the repository code.
# 2. Initializes CodeQL for static security analysis.
# 3. Restores the project's dependencies.
# 4. Builds the .NET project.
# 5. Runs the CodeQL analysis and uploads the results.
#
# CodeQL results can be viewed in:
# Repository → Security and Quality → Code scanning
#
# ------------------------------------------------

name: CodeQL Analysis

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

#   schedule:
#     - cron: '30 1 * * 0' # Runs weekly every Sunday at 01:30 UTC

permissions:
    security-events: write
    contents: read

jobs:

  codeql:

    name: CodeQL Security Analysis

    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    steps:

      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 2. INITIALIZE CODEQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # 4.38.2
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      # 3. RESTORE
      - name: Restore dependencies
        run: |
          dotnet restore src/GitHubActionsDemo.csproj
          dotnet restore tests/GitHubActionsDemo.Tests.csproj

      # 4. BUILD
      - name: Build
        run: |
          dotnet build src/GitHubActionsDemo.csproj --no-restore --configuration Release
          dotnet build tests/GitHubActionsDemo.Tests.csproj --no-restore --configuration Release

      # 5. CODEQL ANALYSIS
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # 4.38.2