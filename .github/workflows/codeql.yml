name: CodeQL Analysis

on:
  push:
    branches:
      - main
      - feature/*

  pull_request:
    branches:
      - main

#   schedule:
#     - cron: '30 1 * * 0' # Runs every Sunday at 01:30 UTC

permissions:
  contents: read
  security-events: write

jobs:

  codeql:

    name: CodeQL Security Analysis

    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    steps:

      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 2. INITIALIZE CODEQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # 4.38.2
        with:
          languages: csharp
          queries: security-extended

      # 3. RESTORE
      - name: Restore dependencies
        run: dotnet restore

      # 4. BUILD
      - name: Build
        run: dotnet build --no-restore

      # 5. CODEQL ANALYSIS
      - name: Analyze
        uses: github/codeql-action/analyze@v4