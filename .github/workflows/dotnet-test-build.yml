name: .NET Test and Build

on:
  # This workflow is triggered by other workflows using the `workflow_call` event.
  workflow_call:

  # This workflow can also be triggered manually using the `workflow_dispatch` event.
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: [GitHubActionsDemo-runner, self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup .NET : If you are not using a self-hosted runner with .NET pre-installed, uncomment the following lines to set up .NET SDK.

      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Show NuGet cache status
        run: |
          echo "=========================================="
          echo " NuGet Cache"
          echo "=========================================="
          echo "Key: ${{ steps.nuget-cache.outputs.cache-primary-key }}"
          echo "Exact cache hit: ${{ steps.nuget-cache.outputs.cache-hit }}"

          if [ "${{ steps.nuget-cache.outputs.cache-hit }}" = "true" ]; then
            echo "RESULT: EXACT CACHE HIT"
          else
            echo "RESULT: EXACT CACHE MISS"
          fi

      - name: Restore dependencies
        run: |
          dotnet restore src/GitHubActionsDemo.csproj
          dotnet restore tests/GitHubActionsDemo.Tests.csproj

      - name: Run tests
        run: dotnet test tests/GitHubActionsDemo.Tests.csproj --no-restore --configuration Release

      - name: Build
        run: dotnet build src/GitHubActionsDemo.csproj --no-restore --configuration Release