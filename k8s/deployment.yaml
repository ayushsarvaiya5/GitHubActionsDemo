apiVersion: apps/v1
kind: Deployment
metadata:
  name: githubactionsdemo
  labels:
    app.kubernetes.io/name: githubactionsdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: githubactionsdemo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: githubactionsdemo
    spec:
      containers:
        - name: githubactionsdemo
          image: ayushisar110/githubactionsdemo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi