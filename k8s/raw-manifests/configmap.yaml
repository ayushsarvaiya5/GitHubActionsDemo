apiVersion: v1
kind: ConfigMap
metadata:
  name: githubactionsdemo-config
  namespace: githubactionsdemo
  labels:
    app.kubernetes.io/name: githubactionsdemo
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "AllowedHosts": "*"
    }
