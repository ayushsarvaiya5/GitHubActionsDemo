apiVersion: apps/v1
kind: Deployment
metadata:
  name: githubactionsdemo
  namespace: githubactionsdemo
  labels:
    app.kubernetes.io/name: githubactionsdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: githubactionsdemo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: githubactionsdemo
    spec:
      containers:
        - name: githubactionsdemo
          image: ayushisar110/githubactionsdemo:5.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: githubactionsdemo-config
            - secretRef:
                name: githubactionsdemo-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: githubactionsdemo-pvc
