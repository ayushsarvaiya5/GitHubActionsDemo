# Example static PersistentVolume using hostPath (single-node/dev clusters
# such as kind/minikube only). Production clusters should use a storage
# class with dynamic provisioning instead.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: githubactionsdemo-pv
  labels:
    app.kubernetes.io/name: githubactionsdemo
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/githubactionsdemo
