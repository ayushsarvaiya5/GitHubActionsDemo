# Standalone Pod example. In practice, prefer a Deployment so Kubernetes
# can reschedule and heal the Pod automatically.
apiVersion: v1
kind: Pod
metadata:
  name: githubactionsdemo-pod
  namespace: githubactionsdemo
  labels:
    app.kubernetes.io/name: githubactionsdemo
spec:
  containers:
    - name: githubactionsdemo
      image: ayushisar110/githubactionsdemo:latest
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      envFrom:
        - configMapRef:
            name: githubactionsdemo-config
        - secretRef:
            name: githubactionsdemo-secret
      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 15
        periodSeconds: 20
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
