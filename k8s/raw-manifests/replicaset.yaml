# Standalone ReplicaSet example. In practice, a Deployment manages
# ReplicaSets for you (rolling updates, rollbacks) — use Deployment instead.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: githubactionsdemo-rs
  namespace: githubactionsdemo
  labels:
    app.kubernetes.io/name: githubactionsdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: githubactionsdemo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: githubactionsdemo
    spec:
      containers:
        - name: githubactionsdemo
          image: ayushisar110/githubactionsdemo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: githubactionsdemo-config
            - secretRef:
                name: githubactionsdemo-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
